name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: python -m trafficpilot --help
      - name: Headless simulation smoke test
        run: python -m trafficpilot simulate --scenario mixed --seed 42 --duration 10 --output /tmp/tp_sim.json
      - name: Headless benchmark smoke test
        run: python -m trafficpilot benchmark --runs 1 --duration 10 --output-json /tmp/tp_bench.json --output-csv /tmp/tp_bench.csv
      - name: Import smoke test
        run: python -c "import trafficpilot; print(trafficpilot.__version__)"
